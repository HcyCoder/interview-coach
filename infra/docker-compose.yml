services:
  mysql:
    image: mysql:8.4
    container_name: interview-coach-mysql
    environment:
      MYSQL_DATABASE: interview_coach
      MYSQL_ROOT_PASSWORD: password
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ppassword']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: interview-coach-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: interview-coach-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
